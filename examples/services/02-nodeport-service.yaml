apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  namespace: service-types-demo
  labels:
    app: nginx
    component: web
    service-type: nodeport
spec:
  type: NodePort
  selector:
    app: nginx
    component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
