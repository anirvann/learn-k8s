apiVersion: v1
kind: Namespace
metadata:
  name: learn-nginx
  labels:
    app: nginx
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-homepage
  namespace: learn-nginx
  labels:
    app: nginx
    learning-step: application
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>learn-k8s nginx</title>
      </head>
      <body>
        <h1>Hello from nginx on Kubernetes</h1>
        <p>This page is served by a Deployment through a Service.</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app
  namespace: learn-nginx
  labels:
    app: nginx
    learning-step: application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
      component: web
  template:
    metadata:
      labels:
        app: nginx
        component: web
        learning-step: application
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: homepage
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: homepage
          configMap:
            name: nginx-homepage
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-app
  namespace: learn-nginx
  labels:
    app: nginx
    learning-step: application
spec:
  type: ClusterIP
  selector:
    app: nginx
    component: web
  ports:
    - name: http
      port: 80
      targetPort: http
